"400" xml:space="preserve">      → Replace with the public API; Guideline 2.5.1 rejects private or deprecated APIs.</text><text x="22" y="330" fill="#FFDD57" font-weight="600" xml:space="preserve">  ▲ RVW201 “coming soon” placeholder in shipped code — reviewers treat visible placeholders as an incom…</text><text x="22" y="349" fill="#C9D1DE" font-weight="400" xml:space="preserve">      at App/RiskyFeatures.swift:20</text><text x="22" y="368" fill="#C9D1DE" font-weight="400" xml:space="preserve">      → Remove it, or gate it behind a debug flag that cannot ship.</text><text x="22" y="387" fill="#FFDD57" font-weight="600" xml:space="preserve">  ▲ RVW401 An external payment provider is referenced in code.</text><text x="22" y="406" fill="#C9D1DE" font-weight="400" xml:space="preserve">      → Guideline 3.1.1: digital goods and subscriptions sold in the app must use In-App Purchase. Phys…</text><text x="22" y="425" fill="#FFDD57" font-weight="600" xml:space="preserve">  ▲ RVW501 The project looks like a web wrapper: WKWebView with no native navigation or list views.</text>
