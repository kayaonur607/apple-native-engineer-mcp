<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B0E"/>
      <stop offset="50%" stop-color="#12151D"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E1E4EA"/>
      <stop offset="100%" stop-color="#9BA1B0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="50%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#5E5CE6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" rx="20" fill="url(#glow)"/>

  <!-- Subtle Specular Border -->
  <rect x="0.5" y="0.5" width="1199" height="399" rx="19.5" stroke="white" stroke-opacity="0.12"/>

  <!-- Main Content Group -->
  <g transform="translate(100, 85)">
    <!-- Original Design Engineering Icon (Geometric Precision Squircles & Layer Diamond) -->
    <g transform="translate(0, 8)">
      <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#accentGrad)" fill-opacity="0.2" stroke="url(#accentGrad)" stroke-width="1.5"/>
      <!-- Inner Precision Geometric Motif -->
      <rect x="12" y="12" width="32" height="32" rx="9" stroke="white" stroke-opacity="0.9" stroke-width="2"/>
      <path d="M28 17V39M17 28H39" stroke="white" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="3" fill="white"/>
    </g>

    <!-- Main Title -->
    <text x="75" y="46" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5" fill="url(#textGrad)">
      Apple Native Engineer MCP
    </text>

    <!-- Subtitle Tagline -->
    <text x="75" y="86" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="19" font-weight="400" fill="#8E95A5">
      Apple Platform Design Engineering Standard, Executable Toolkit &amp; MCP Server
    </text>

    <!-- Pillar Chips -->
    <g transform="translate(75, 116)">
      <!-- Chip 1: HIG & Design -->
      <rect x="0" y="0" width="135" height="32" rx="16" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.15"/>
      <text x="67" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#0A84FF" text-anchor="middle">🎨 HIG &amp; Design</text>

      <!-- Chip 2: Swift 6 Concurrency -->
      <rect x="145" y="0" width="150" height="32" rx="16" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.15"/>
      <text x="220" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#FF9F0A" text-anchor="middle">⚡️ Swift 6 Concurrency</text>

      <!-- Chip 3: Privacy Manifests -->
      <rect x="305" y="0" width="145" height="32" rx="16" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.15"/>
      <text x="377" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#30D158" text-anchor="middle">🔒 Privacy Manifests</text>

      <!-- Chip 4: App Store Pre-Flight -->
      <rect x="460" y="0" width="150" height="32" rx="16" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.15"/>
      <text x="535" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#BF5AF2" text-anchor="middle">🚀 App Store Pre-Flight</text>

      <!-- Chip 5: Kowalski Motion -->
      <rect x="620" y="0" width="140" height="32" rx="16" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.15"/>
      <text x="690" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#64D2FF" text-anchor="middle">✨ Kowalski Springs</text>
    </g>

    <!-- Clear Independent Developer Disclaimer -->
    <g transform="translate(75, 172)">
      <rect x="0" y="0" width="620" height="28" rx="8" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08"/>
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="400" fill="#7E8696">
        Independent Open-Source Project • Not affiliated with, sponsored by, or endorsed by Apple Inc.
      </text>
    </g>
  </g>
</svg>
