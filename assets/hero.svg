<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="apple-native-engineer-mcp — 14 auditors, 13 MCP tools, verified by CI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0C11"/>
      <stop offset="0.55" stop-color="#0D1017"/>
      <stop offset="1" stop-color="#0A0B10"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 40) rotate(38) scale(520 420)">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 430) rotate(-135) scale(520 420)">
      <stop offset="0" stop-color="#BF5AF2" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#BF5AF2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="64" y1="150" x2="560" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C3CAD8"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="64" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#BF5AF2"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="640" y1="90" x2="1140" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A3242"/>
      <stop offset="1" stop-color="#171C26"/>
    </linearGradient>
    <filter id="cardShadow" x="600" y="60" width="580" height="360" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.022"/>
    </pattern>
  </defs>

  <rect width="1200" height="460" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="460" rx="26" fill="url(#glowBlue)"/>
  <rect width="1200" height="460" rx="26" fill="url(#glowViolet)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="458.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
    <rect x="64" y="62" width="52" height="3" rx="1.5" fill="url(#accentLine)"/>
    <text x="64" y="96" font-size="12.5" font-weight="600" letter-spacing="2.4" fill="#7C879B">APPLE NATIVE ENGINEER · MCP SERVER</text>

    <text x="64" y="152" font-size="42" font-weight="700" letter-spacing="-1.1" fill="url(#title)">apple-native-engineer-mcp</text>

    <text x="64" y="196" font-size="19" font-weight="600" fill="#E8ECF3">Apple's rules, expressed as exit codes.</text>
    <text x="64" y="223" font-size="17" font-weight="400" fill="#93A0B5">Your agent can no longer declare a screen finished</text>
    <text x="64" y="247" font-size="17" font-weight="400" fill="#93A0B5">without proving it.</text>

    <g font-size="12.5" font-weight="600">
      <rect x="64" y="288" width="112" height="30" rx="15" fill="#0A84FF" fill-opacity="0.12" stroke="#0A84FF" stroke-opacity="0.35"/>
      <text x="82" y="307" fill="#69B4FF">14 auditors</text>

      <rect x="186" y="288" width="118" height="30" rx="15" fill="#BF5AF2" fill-opacity="0.12" stroke="#BF5AF2" stroke-opacity="0.35"/>
      <text x="204" y="307" fill="#D79BFF">13 MCP tools</text>

      <rect x="314" y="288" width="92" height="30" rx="15" fill="#30D158" fill-opacity="0.12" stroke="#30D158" stroke-opacity="0.35"/>
      <text x="332" y="307" fill="#6FE08A">93 tests</text>

      <rect x="416" y="288" width="128" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="434" y="307" fill="#B9C3D3">iOS 26 – 27</text>
    </g>

    <text x="64" y="352" font-size="13" fill="#6C7789">Swift 6 · Xcode 27 SDK · Python 3.10+ · Node 20+</text>
    <text x="64" y="404" font-size="13.5" font-weight="500" fill="#8C98AC">github.com/kayaonur607/apple-native-engineer-mcp</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="640" y="88" width="500" height="292" rx="16" fill="#0C0F15"/>
    <rect x="640" y="88" width="500" height="292" rx="16" stroke="url(#cardStroke)" stroke-width="1.5"/>
  </g>

  <g>
    <circle cx="664" cy="112" r="5" fill="#FF5F57"/>
    <circle cx="682" cy="112" r="5" fill="#FEBC2E"/>
    <circle cx="700" cy="112" r="5" fill="#28C840"/>
    <text x="720" y="117" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11.5" fill="#6B7688">swiftui-linter · legacy-app</text>
    <line x1="640" y1="134" x2="1140" y2="134" stroke="#FFFFFF" stroke-opacity="0.07"/>
  </g>

  <g font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#C9D1DE">
    <rect x="662" y="158" width="4" height="12" rx="2" fill="#FF453A"/>
    <text x="676" y="168" fill="#FF6B60" font-weight="600">SWU003</text>
    <text x="742" y="168">NavigationView is deprecated since iOS 16.</text>

    <rect x="662" y="186" width="4" height="12" rx="2" fill="#FF453A"/>
    <text x="676" y="196" fill="#FF6B60" font-weight="600">SWU006</text>
    <text x="742" y="196">UIScreen.main.bounds is not multi-window safe.</text>

    <rect x="662" y="214" width="4" height="12" rx="2" fill="#FFD60A"/>
    <text x="676" y="224" fill="#FFDD57" font-weight="600">SWU001</text>
    <text x="742" y="224">Hardcoded hex colour breaks Dark Mode.</text>

    <rect x="662" y="242" width="4" height="12" rx="2" fill="#FFD60A"/>
    <text x="676" y="252" fill="#FFDD57" font-weight="600">SWU002</text>
    <text x="742" y="252">.foregroundColor(_:) is deprecated since iOS 17.</text>

    <rect x="662" y="270" width="4" height="12" rx="2" fill="#64D2FF"/>
    <text x="676" y="280" fill="#8FE0FF" font-weight="600">SWU007</text>
    <text x="742" y="280">lineLimit(1) can clip localised copy.</text>
  </g>

  <line x1="662" y1="302" x2="1118" y2="302" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g font-family="'SF Mono', ui-monospace, Menlo, monospace">
    <text x="662" y="330" font-size="12.5" fill="#FF6B60" font-weight="700">FAIL</text>
    <text x="706" y="330" font-size="12.5" fill="#8B96A8">0 critical · 3 error · 8 warning · 3 info</text>
    <text x="662" y="354" font-size="11.5" fill="#5F6A7C">release gate → BLOCKED · 19/100</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
    <circle cx="648" cy="412" r="4" fill="#30D158"/>
    <text x="662" y="417" font-size="12" font-weight="500" fill="#7C879B">verified by CI · 6 jobs · 93 tests · every claim reproducible</text>
  </g>
</svg>
