<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="apple-native-engineer-mcp logo">
  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141A26"/>
      <stop offset="0.55" stop-color="#0D1119"/>
      <stop offset="1" stop-color="#080A0F"/>
    </linearGradient>
    <radialGradient id="lgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 90) rotate(45) scale(380 380)">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lgGlow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 450) rotate(-140) scale(340 340)">
      <stop offset="0" stop-color="#BF5AF2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#BF5AF2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lgBracket" x1="120" y1="160" x2="392" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FA3FF"/>
      <stop offset="1" stop-color="#C07BFF"/>
    </linearGradient>
    <linearGradient id="lgCheck" x1="196" y1="200" x2="330" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE4F2"/>
    </linearGradient>
    <linearGradient id="lgRim" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#lgBg)"/>
  <rect width="512" height="512" rx="114" fill="url(#lgGlow)"/>
  <rect width="512" height="512" rx="114" fill="url(#lgGlow2)"/>

  <!-- code brackets -->
  <path d="M168 186 L118 256 L168 326" stroke="url(#lgBracket)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <path d="M344 186 L394 256 L344 326" stroke="url(#lgBracket)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- verified check -->
  <path d="M203 258 L243 300 L313 214" stroke="url(#lgCheck)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- rim -->
  <rect x="1" y="1" width="510" height="510" rx="113" stroke="url(#lgRim)" stroke-width="2"/>
</svg>
