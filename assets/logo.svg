<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="apple-native-engineer-mcp logo">
  <defs>
    <linearGradient id="lgBase" x1="40" y1="20" x2="472" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#182135"/>
      <stop offset="0.45" stop-color="#0E1420"/>
      <stop offset="1" stop-color="#070A10"/>
    </linearGradient>
    <radialGradient id="lgAuraA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(110 70) rotate(42) scale(300 260)">
      <stop offset="0" stop-color="#2E9BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2E9BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lgAuraB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 470) rotate(-138) scale(280 240)">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lgBracket" x1="150" y1="150" x2="362" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63B3FF"/>
      <stop offset="0.55" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="lgCheck" x1="205" y1="205" x2="320" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFD9EA"/>
    </linearGradient>
    <linearGradient id="lgSheen" x1="0" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lgRim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="lgSoft" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="lgSquircle">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#lgSquircle)">
    <rect width="512" height="512" fill="url(#lgBase)"/>
    <rect width="512" height="512" fill="url(#lgAuraA)"/>
    <rect width="512" height="512" fill="url(#lgAuraB)"/>
    <rect width="512" height="300" fill="url(#lgSheen)"/>
    <ellipse cx="256" cy="470" rx="200" ry="60" fill="#000000" opacity="0.35" filter="url(#lgSoft)"/>
  </g>

  <!-- mark: ‹ ✓ › -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M170 184 L124 256 L170 328" stroke="url(#lgBracket)" stroke-width="26" opacity="0.95"/>
    <path d="M342 184 L388 256 L342 328" stroke="url(#lgBracket)" stroke-width="26" opacity="0.95"/>
    <path d="M207 258 L246 299 L313 214" stroke="#000000" stroke-width="36" opacity="0.35"/>
    <path d="M207 258 L246 299 L313 214" stroke="url(#lgCheck)" stroke-width="30"/>
  </g>

  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" stroke="url(#lgRim)" stroke-width="3"/>
