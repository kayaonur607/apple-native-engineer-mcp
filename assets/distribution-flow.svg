<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="Distribution flow: preflight checks, ExportOptions, local archive, then upload or notarization only after the developer approves, then processing confirmation.">
<rect width="1600" height="560" rx="28" fill="#0b1018"/>
<g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif">
<text x="60" y="68" fill="#75e0bd" font-size="21" letter-spacing="3">PLAN_DISTRIBUTION</text>
<text x="60" y="114" fill="#edf3fb" font-size="34" font-weight="600">From archive to TestFlight, the App Store or a notarized Mac app</text>
<g fill="#141d2a" stroke="#29374b" stroke-width="2"><rect x="60" y="170" width="270" height="230" rx="18"/><rect x="365" y="170" width="270" height="230" rx="18"/><rect x="670" y="170" width="270" height="230" rx="18"/></g>
<g fill="#1b1714" stroke="#7a5a2c" stroke-width="2"><rect x="975" y="170" width="270" height="230" rx="18"/></g>
<g fill="#141d2a" stroke="#29374b" stroke-width="2"><rect x="1280" y="170" width="260" height="230" rx="18"/></g>
<g fill="#edf3fb" font-size="26" font-weight="600"><text x="88" y="218">1 · Preflight</text><text x="393" y="218">2 · Export options</text><text x="698" y="218">3 · Archive</text><text x="1003" y="218">4 · Upload</text><text x="1308" y="218">5 · Confirm</text></g>
<g fill="#a2b1c6" font-size="19">
<text x="88" y="262">Team, version, build</text><text x="88" y="292">Export compliance</text><text x="88" y="322">Hardened Runtime</text><text x="88" y="352">App Sandbox</text><text x="88" y="382">Privacy manifest, icon</text>
<text x="393" y="262">Keys from xcodebuild</text><text x="393" y="292">-help (Xcode 27.2)</text><text x="393" y="322">app-store-connect</text><text x="393" y="352">developer-id · internal</text><text x="393" y="382">TestFlight only</text>
<text x="698" y="262">xcodebuild archive</text><text x="698" y="292">Local, reversible</text><text x="698" y="322">ASC API key from</text><text x="698" y="352">environment variables</text>
<text x="1003" y="262">altool · notarytool</text><text x="1003" y="292">stapler · spctl</text><text x="1003" y="322" fill="#f5c26b">Changes account state:</text><text x="1003" y="352" fill="#f5c26b">runs only with approval</text>
<text x="1308" y="262">app_store_connect</text><text x="1308" y="292">builds (read-only)</text><text x="1308" y="322">Gatekeeper verdict</text>
</g>
<g fill="#75e0bd" font-size="30"><text x="336" y="296">→</text><text x="641" y="296">→</text><text x="946" y="296">→</text><text x="1251" y="296">→</text></g>
<path d="M60 440H1540" stroke="#29374b"/>
<text x="60" y="486" fill="#edf3fb" font-size="23">Findings DST010–DST070 explain what would stop the upload before it happens.</text>
<text x="60" y="522" fill="#a2b1c6" font-size="20">The server plans and checks; it never builds, uploads or contacts Apple on its own.</text>
</g></svg>
