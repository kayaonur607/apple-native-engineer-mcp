name: GitHub Release

on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify versioned release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        working-directory: integrations/mcp-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify all release gates
        run: ./scripts/verify.sh
      - name: Match tag to version and extract notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  release:
    name: Publish GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Publish version and changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "Apple Native Engineer ${RELEASE_TAG#mcp-}" --notes-file release-notes.md assets/demo/*
