name: Publish

# Publishes the npm package and the registry manifest on a version tag.
#
#   git tag mcp-v2.0.1 && git push origin mcp-v2.0.1
#
# The staged `vendor/` payload is generated by `prepack`, so the published
# tarball always matches the repository at the tagged commit.

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: integrations/mcp-server
        run: npm ci

      - name: Test before publishing
        working-directory: integrations/mcp-server
        run: npm test

      - name: Ensure the tarball is self-contained
        working-directory: integrations/mcp-server
        run: |
          npm run vendor
          node scripts/pack-vendor.mjs --check

      - name: Publish
        working-directory: integrations/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Verify the published package installs and runs
        run: |
          version="$(node -p "require('./integrations/mcp-server/package.json').version")"
          mkdir -p /tmp/install-check && cd /tmp/install-check
          npm init -y >/dev/null
          npm install "apple-native-engineer-mcp@${version}"
          ./node_modules/.bin/apple-native-engineer-mcp --selftest
