name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Structure, links and counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python3 scripts/validate_repo.py

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and golden tests
        run: python3 -m unittest discover -s tests -t tests -v

  mcp:
    name: MCP Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: integrations/mcp-server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        working-directory: integrations/mcp-server
        run: npm ci
      - name: Run MCP client/server tests
        working-directory: integrations/mcp-server
        run: npm test
      - name: Check production dependency advisories
        working-directory: integrations/mcp-server
        run: npm audit --omit=dev --audit-level=high

  swift:
    name: Swift compilation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$newest" ]; then
            echo "selecting $newest"
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
      - name: Type-check fixtures and parse documentation snippets
        run: ./scripts/verify-swift.sh
      - name: Validate generated SDK reference
        run: python3 scripts/generate_whats_new.py --validate
      - name: Verify documented API exists in the SDK
        run: python3 scripts/check_api_claims.py
      - name: Type-check documented snippets
        run: python3 scripts/typecheck_snippets.py --strict

  package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/mcp-server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: integrations/mcp-server
        run: npm ci
      - name: Verify the vendored payload is current
        working-directory: integrations/mcp-server
        run: |
          npm run vendor
          node scripts/pack-vendor.mjs --check
      - name: Pack, install in a clean directory and run
        working-directory: integrations/mcp-server
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/install" && cd "$RUNNER_TEMP/install"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/*.tgz
          ./node_modules/.bin/apple-native-engineer-mcp --selftest
          ./node_modules/.bin/apple-native-engineer-mcp --doctor
