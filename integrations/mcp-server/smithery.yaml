# Smithery / registry metadata.
#
# The server needs no configuration to work: it reads the project the client is
# looking at. The only knob worth exposing is the Python interpreter, because a
# machine can have several and only one of them is on PATH for the client.
name: apple-native-engineer
description: >-
  Verifiable Apple-platform engineering audits for AI agents: SwiftUI linting, Liquid Glass and accessibility
  review, privacy manifests, localisation, widgets, App Store readiness — plus the reference library as MCP
  resources and the review workflows as prompts. Static analysis only; no network calls, no telemetry by default.
license: MIT
homepage: https://github.com/kayaonur607/apple-native-engineer-mcp
repository: https://github.com/kayaonur607/apple-native-engineer-mcp
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      pythonPath:
        type: string
        default: python3
        description: Interpreter used to run the Python auditors (standard library only).
      telemetry:
        type: string
        enum: [off, local, anonymous]
        default: off
        description: Aggregate usage counting. Off by default; never records paths, file names or source text.
    required: []
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "apple-native-engineer-mcp"],
      env: {
        APPLE_NATIVE_PYTHON: config.pythonPath || "python3",
        APPLE_NATIVE_TELEMETRY: config.telemetry || "off"
      }
    })
